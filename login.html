<body class="bg-surface font-body-md text-on-surface h-screen w-full flex items-center justify-center relative overflow-hidden">

<!-- Logo Header -->
<div class="flex flex-col items-center mb-stack-lg">
<img alt="TNG Group SAS Logo" class="h-12 w-auto mb-stack-md" data-alt="The official logo of TNG Group SAS, featuring metallic silver letters 'TNG' and a dynamic blue sweeping graphic line over the text." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFpF0K7ydl4WF4w00m6XqV0yfNOqodMz-LVCwNbcpwc82zl6lj7Vx9WQAnYDfmo9S3HRv1kwY9K9IEvMyJYRXUi4-7YHUvklRvgyr90R-aU-cfgKMkPnEMyfxXiXyZWk91UaDKBWotLNH_SfGCnEuoFy-ZqDqC_dCss-6ffWrAIx1Ta4tNeo_bh3LpOkePJ6lNX-AlMfAHDrNTpKv-to4skH_jqLhgKw4JbbFaaiumYpRC-G6mZ4ThnmSF5T4lu_vk2Zo">
<h1 class="font-title-md text-title-md text-on-surface">Acceso Panel de Control</h1>
</div>
<!-- Login Form -->
<form id="loginForm" class="space-y-stack-md">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm" for="email">Correo electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-surface-variant rounded-DEFAULT focus:ring-primary focus:border-primary sm:text-sm bg-surface-container-lowest text-on-surface focus:outline-none transition-colors duration-200" id="email" name="email" placeholder="consultastng@gmail.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-surface-variant rounded-DEFAULT focus:ring-primary focus:border-primary sm:text-sm bg-surface-container-lowest text-on-surface focus:outline-none transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Error message -->
<p id="loginError" class="text-error text-label-sm font-label-sm hidden">Correo o contraseña incorrectos.</p>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between mt-stack-md">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-surface-variant rounded-sm" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-label-sm text-label-sm text-on-surface-variant" for="remember-me">
                        Recordarme
                    </label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors duration-200" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-sm">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary btn-primary-gradient hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 transform hover:-translate-y-[1px]" type="submit">
                    Iniciar Sesión
                </button>
</div>
</form>
<!-- Footer Note -->
<div class="mt-stack-lg text-center">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">admin_panel_settings</span>
                Acceso exclusivo para personal autorizado
            </p>
</div>
</div>

<script>
  // =========================================================
  // Acceso al Panel de Control — validación simple del lado
  // del cliente. Cambiá ACCESO_VALIDO antes de publicar.
  // No es seguridad robusta (el código es visible en el
  // navegador), pero evita que cualquiera entre sin clave.
  // =========================================================
  const ACCESOS_VALIDOS = [
    { email: "consultastng@gmail.com", password: "tng2026" }
  ];

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('loginError');

    const ok = ACCESOS_VALIDOS.some(u => u.email === email && u.password === password);

    if(ok){
      sessionStorage.setItem('tng_admin_auth', 'true');
      window.location.href = 'inventario.html';
    } else {
      errorMsg.classList.remove('hidden');
    }
  });
</script>
